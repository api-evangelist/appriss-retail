aid: appriss-retail
name: Appriss Retail
description: >-
  Appriss Retail provides AI-powered solutions that help retailers manage Total
  Retail Loss across in-store and online channels. Its SaaS platform combines data
  intelligence, decision intelligence, and workflow intelligence to reduce returns
  fraud, shrink, and exceptions in real time. Marquee products include Appriss
  Engage (return and claims authorization, incorporating the Verify return-authorization
  engine), Appriss Secure (shrink and exception analytics), Appriss Incident (case
  management), Sidekick (an AI collaborator for loss-prevention teams), and the APIS
  performance-intelligence platform. Appriss Retail serves more than 60 of the top
  100 U.S. retailers, drawing on 20+ years of retail data science. Programmatic
  integration is delivered to retailer clients through the APIS Online cloud portal
  rather than a public self-serve developer program.
